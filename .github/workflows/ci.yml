name: CI

# The checks run in the image of compose.yaml; the production image is built and smoke-tested here (NFR5).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that changes only docs/ skips every job below; the required `ci` check still reports, green.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ -z "$PR" ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A file moved into docs/ counts by its old path too. The API lists 3,000 files at most: a shorter list
          # than the pull request's count proves nothing, so everything runs.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[] | "\(.filename)\t\(.previous_filename // "")"')
          listed=$(grep -c . <<< "$files" || true)
          if [ "$listed" -lt "$CHANGED" ] || tr '\t' '\n' <<< "$files" | grep . | grep -qv '^docs/'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Types, lint, boundaries, unit tests
        run: docker compose run --rm --no-deps app sh -c 'npm ci && npm run check'
      - name: Audit the production dependencies
        run: docker compose run --rm --no-deps app npm audit --omit=dev --audit-level=high

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target production -t maillon-app:ci -f docker/app/Dockerfile .
      - run: docker compose --profile pipeline build pipeline
      - run: docker run -d --name app -p 4321:4321 maillon-app:ci
      - run: sh scripts/smoke.sh http://localhost:4321
      - if: failure()
        run: docker logs app

  ci:
    needs: [changes, checks, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A job ended with: $result" >&2; exit 1 ;;
            esac
          done
