services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: dev
    ports:
      - "${APP_PORT:-4321}:4321"
    environment:
      MOTIS_URL: http://motis:8080
      DATA_DIR: /data
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - data:/data:ro

  # Serves the release `current` points to; restart it after the pipeline to load a new one.
  motis:
    image: &motis-image ghcr.io/motis-project/motis:2.11.4
    working_dir: /data/current
    command: ["/motis", "server", "data"]
    restart: unless-stopped
    ports:
      - "${MOTIS_PORT:-8080}:8080"
    volumes:
      - data:/data:ro

  # Builds a new release of the engine's data: `scripts/refresh-data.sh` runs it, then restarts motis.
  pipeline:
    profiles: [pipeline]
    build:
      context: .
      dockerfile: docker/pipeline/Dockerfile
      args:
        MOTIS_IMAGE: *motis-image
    # Nouvelle-Aquitaine's import peaks near 3 GB (ADR-0007).
    mem_limit: 4g
    environment:
      - PIPELINE_TODAY
      - TBM_GTFS_URL
      - SNCF_GTFS_URL
      - OSM_URL
      - OSM_MAX_AGE_DAYS
    volumes:
      - data:/data

volumes:
  node_modules:
  data:
